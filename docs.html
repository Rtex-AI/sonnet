<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SONNET KM — Build Specification</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{--nav:#16213D;--ink:#1F3864;--acc:#3B37E6;--mut:#5C6890;--line:#D5DDF2;--bg:#F7F9FE;--card:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:#16213D;font-size:14.5px;line-height:1.65}

/* gate */
#gate{position:fixed;inset:0;background:linear-gradient(150deg,#16213D,#2B1E6B);display:flex;
 align-items:center;justify-content:center;z-index:99;padding:20px}
.gbox{background:#fff;border-radius:14px;padding:38px 34px;width:100%;max-width:390px;
 box-shadow:0 24px 60px rgba(0,0,0,.35)}
.gbox h1{font-size:22px;color:var(--ink);margin-bottom:4px}
.gbox p{font-size:12.5px;color:var(--mut);margin-bottom:22px}
.gbox input{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:8px;
 font-family:inherit;font-size:14px;outline:none}
.gbox input:focus{border-color:var(--acc)}
.gbox button{width:100%;margin-top:12px;padding:11px;border:0;border-radius:8px;background:var(--acc);
 color:#fff;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}
.gbox button:disabled{opacity:.6;cursor:default}
.err{color:#C0392B;font-size:12.5px;margin-top:10px;min-height:17px}

/* shell */
.app{display:none;grid-template-columns:290px 1fr;min-height:100vh}
.app.on{display:grid}
nav{background:var(--nav);color:#C7D2EE;padding:18px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
nav .brand{padding:0 20px 16px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:12px}
nav .brand b{color:#fff;font-size:17px;letter-spacing:.3px}
nav .brand span{display:block;font-size:11px;color:#8DA0CC;margin-top:2px}
nav .sec{padding:14px 20px 5px;font-size:10px;letter-spacing:1.1px;color:#7C8DBC;font-weight:600}
nav a{display:block;padding:6px 20px;color:#C7D2EE;text-decoration:none;font-size:13px;border-left:3px solid transparent}
nav a:hover{background:rgba(255,255,255,.06);color:#fff}
nav a.on{background:rgba(59,55,230,.28);border-left-color:#6C67FF;color:#fff;font-weight:500}
main{padding:36px 46px 90px;max-width:1080px}

h1{font-size:29px;color:var(--ink);margin:8px 0 18px;line-height:1.25}
h2{font-size:20px;color:var(--ink);margin:34px 0 12px;padding-bottom:7px;border-bottom:2px solid var(--line)}
h3{font-size:16px;color:var(--acc);margin:24px 0 9px}
p{margin:0 0 12px}
ul,ol{margin:0 0 14px 22px}li{margin-bottom:5px}
blockquote{background:#EEF1FA;border-left:3px solid var(--acc);padding:11px 16px;margin:0 0 18px;
 border-radius:0 7px 7px 0;font-size:13px;color:#3A4771}
code{font-family:'JetBrains Mono',monospace;font-size:12.5px;background:#EEF1FA;padding:1.5px 5px;border-radius:4px;color:#2B3A6B}
pre{background:#16213D;color:#D7E0F5;padding:15px 18px;border-radius:9px;overflow-x:auto;margin:0 0 16px}
pre code{background:none;color:inherit;padding:0;font-size:12.5px;line-height:1.6}
table{border-collapse:collapse;width:100%;margin:0 0 18px;font-size:13px;display:block;overflow-x:auto}
th{background:var(--ink);color:#fff;text-align:left;padding:8px 11px;font-weight:600;white-space:nowrap}
td{padding:7px 11px;border-bottom:1px solid #E4EAF7;vertical-align:top}
tr:nth-child(even) td{background:#F6F8FE}
img{max-width:100%;border:1.5px solid var(--line);border-radius:9px;margin:6px 0 18px;display:block}
hr{border:0;border-top:1.5px solid var(--line);margin:26px 0}
strong{color:var(--ink)}
.mermaid{background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:16px;margin:0 0 18px;text-align:center}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:44px;padding-top:18px;border-top:1.5px solid var(--line)}
.pager a{color:var(--acc);text-decoration:none;font-size:13px;font-weight:500}
@media(max-width:880px){.app.on{grid-template-columns:1fr}nav{position:static;height:auto}main{padding:24px 20px 60px}}
</style></head><body>

<div id="gate">
  <div class="gbox">
    <h1>SONNET KM</h1>
    <p>Build specification &mdash; internal. Enter the access password.</p>
    <input id="pw" type="password" placeholder="Password" autocomplete="off" autofocus>
    <button id="go">Open documentation</button>
    <div class="err" id="err"></div>
  </div>
</div>

<div class="app" id="app">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(pw){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name:'PBKDF2', salt:b(SALT), iterations:ITER, hash:'SHA-256' },
    km, { name:'AES-GCM', length:256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b(IV) }, key, b(CT));
  return JSON.parse(new TextDecoder().decode(pt));
}

let PAGES = [], idx = 0;

function group(f){
  if (f.startsWith('modules/')) return 'Modules';
  if (/^(9|99)/.test(f)) return 'Delivery';
  return 'Foundation';
}

function buildNav(){
  const n = document.getElementById('nav');
  let html = '<div class="brand"><b>SONNET KM</b><span>Build specification</span></div>';
  let last = '';
  PAGES.forEach((p,i)=>{
    const g = group(p.file);
    if (g !== last){ html += `<div class="sec">${g}</div>`; last = g; }
    html += `<a href="#${i}" data-i="${i}">${p.title}</a>`;
  });
  n.innerHTML = html;
}

async function render(i){
  idx = Math.max(0, Math.min(i, PAGES.length-1));
  const p = PAGES[idx];
  const m = document.getElementById('main');
  m.innerHTML = marked.parse(p.md);

  // mermaid blocks
  const blocks = [...m.querySelectorAll('pre code.language-mermaid')];
  for (let k=0;k<blocks.length;k++){
    const src = blocks[k].textContent;
    const div = document.createElement('div');
    div.className = 'mermaid';
    let ok = false;
    try { ok = await mermaid.parse(src, { suppressErrors:true }); } catch(e){ ok = false; }
    if (ok) {
      try { const {svg} = await mermaid.render('mm'+idx+'_'+k, src); div.innerHTML = svg; }
      catch(e){ ok = false; }
    }
    if (!ok) {
      const pre = document.createElement('pre');
      pre.textContent = src;
      div.style.textAlign = 'left';
      div.innerHTML = '<div style="font-size:12px;color:#8892B5;margin-bottom:8px">'
                    + 'Diagram source (renderer could not draw it)</div>';
      div.appendChild(pre);
    }
    blocks[k].closest('pre').replaceWith(div);
  }

  const prev = idx>0 ? `<a href="#${idx-1}">&larr; ${PAGES[idx-1].title}</a>` : '<span></span>';
  const next = idx<PAGES.length-1 ? `<a href="#${idx+1}">${PAGES[idx+1].title} &rarr;</a>` : '<span></span>';
  m.insertAdjacentHTML('beforeend', `<div class="pager">${prev}${next}</div>`);

  document.querySelectorAll('body > svg[id^="mm"], body > .mermaid, #dmm').forEach(n=>n.remove());
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on', +a.dataset.i===idx));
  window.scrollTo(0,0);
  document.title = p.title + ' — SONNET KM';
}

document.getElementById('go').onclick = async () => {
  const btn = document.getElementById('go'), err = document.getElementById('err');
  btn.disabled = true; err.textContent = 'Decrypting…';
  try {
    const data = await unlock(document.getElementById('pw').value);
    PAGES = data.pages;
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').classList.add('on');
    buildNav();
    await render(location.hash ? +location.hash.slice(1) || 0 : 0);
    try { sessionStorage.setItem('skm-doc', '1'); } catch(e){}
  } catch(e){
    err.textContent = 'Incorrect password.'; btn.disabled = false;
  }
};
document.getElementById('pw').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('go').click();
});
window.addEventListener('hashchange', () => { if (PAGES.length) render(+location.hash.slice(1) || 0); });
</script>
</body></html>
